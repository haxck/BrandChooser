<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商标类目选勾器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{display:flex;flex-direction:column;height:100vh;padding:12px;gap:12px;background:#f5f7fa}
.topbar{display:flex;align-items:center;gap:12px;padding:0 4px}
.topbar h1{font-size:18px;color:#222;white-space:nowrap}
.topbar .load-status{font-size:12px;color:#888}
/* 大类 Tab 栏 */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px;border-bottom:1px solid #e5e7eb}
.tab{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;cursor:pointer;font-size:13px;line-height:1.2;text-align:left}
.tab:hover{background:#f3f4f6}
.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.tab .cnt{font-size:11px;opacity:.7;margin-left:4px}
.tab.sel .dot{color:#22c55e;font-weight:bold}
.main{display:flex;flex:1;gap:12px;min-height:0}
.panel{background:#fff;border-radius:8px;padding:16px;overflow:auto}
.left{width:55%;border:1px solid #e5e7eb;overflow:hidden;display:flex;flex-direction:column}
.right{width:35%;border:1px solid #e5e7eb}
#tree{overflow:auto;flex:1;min-height:0}
.nav{width:12%;border:1px solid #e5e7eb;overflow:auto}
.panel h3{margin-bottom:12px;color:#222;font-size:15px;display:flex;align-items:center;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px}
.ctrl-bar{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{padding:6px 12px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:13px}
button:hover{filter:brightness(.95)}
button.ghost{background:#eef2ff;color:#2563eb;border:1px solid #c7d2fe}
button.secondary{background:#888}
button.btn-json{background:#16a34a}
button.btn-txt{background:#ea580c}
button.btn-csv{background:#7c3aed}
button:disabled{opacity:.5;cursor:not-allowed}
.count{font-size:12px;color:#888;margin-left:auto}
.tree-item{margin:8px 0}
.class-title{font-weight:600;cursor:pointer;padding:4px 0;display:flex;gap:6px;align-items:center}
.group-title{font-weight:500;color:#333;margin:8px 0 4px 18px;display:flex;gap:6px;align-items:center}
.group-title label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px 8px;border-radius:6px;flex:1;user-select:none}
.group-title label:hover{background:#f0f6ff}
.item{margin-left:18px;color:#444;font-size:13px;display:flex;gap:6px;align-items:center;border-radius:6px;margin-bottom:2px}
.item label{display:flex;gap:8px;align-items:center;cursor:pointer;padding:7px 8px;flex:1;user-select:none;border-radius:6px;min-height:30px}
.item label:hover{background:#eef4ff}
.item.sel label{background:#eef2ff}
.item label input{flex:none;width:18px;height:18px;cursor:pointer;accent-color:#2563eb}
.only-selected{font-size:12px;color:#2563eb;cursor:pointer;user-select:none}
#result ul{list-style:none}
#result li{padding:2px 0;font-size:13px;display:flex;gap:6px;align-items:center}
.all-sum{font-size:12px;color:#888;margin-top:10px}

/* ===== 移动端响应式 ===== */
.mobile-nav{display:none}
@media (max-width: 900px){
  body{padding:8px;gap:8px}
  .topbar h1{font-size:16px}
  /* 移动端：两栏变两页，靠底部导航切换 */
  .main{display:block;overflow:hidden}
  .panel.left,.panel.right{width:100%;height:100%;border:1px solid #e5e7eb}
  .panel.right{display:none}
  .main.show-result .panel.left{display:none}
  .main.show-result .panel.right{display:block}
  /* 底部导航 */
  .mobile-nav{display:flex;position:sticky;top:0;z-index:20;gap:8px;padding:6px 0;background:#fff;border-bottom:1px solid #e5e7eb;margin-bottom:4px}
  .mobile-nav button{flex:1;padding:10px 0;font-size:14px}
  .mobile-nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
  .mobile-nav button:not(.on){background:#fff;color:#2563eb;border:1px solid #c7d2fe}
  .ctrl-bar button{padding:9px 12px}
  .item label{min-height:34px;padding:9px 8px;font-size:14px}
  .group-title label{padding:9px 8px}
  .search{padding:10px;font-size:15px}
  .tabs{max-height:120px;overflow-y:auto}
  .panel{padding:12px}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>商标类目选勾器</h1>
  <span class="load-status" id="loadStatus">加载中…</span>
</div>
<!-- 按大类分页 Tab -->
<div class="tabs" id="tabs"></div>
<!-- 移动端：选择 / 已选 切换导航 -->
<div class="mobile-nav">
  <button id="mvSel" class="on" onclick="showPanel('sel')">☰ 选择小类</button>
  <button id="mvRes" onclick="showPanel('res')">已选清单 (<span id="mvCount">0</span>)</button>
</div>

<div class="main">
  <!-- 左侧：当前大类的分类树 -->
  <div class="panel left">
    <h3 id="panelTitle">选择小类</h3>
    <input class="search" id="search" placeholder="搜索编码 / 名称 / 类似群">
    <div class="ctrl-bar">
      <button onclick="clearClass()" class="ghost">清空当前类</button>
      <button onclick="clearAll()" class="ghost">清空全部</button>
      <button onclick="toggleCurOnly()" class="ghost" id="curOnlyBtn">只看已选</button>
      <span class="count" id="treeCount"></span>
    </div>
    <div id="tree"></div>
  </div>

  <!-- 中间/右侧：导航（可不必要，顶部已有 Tab）占位隐藏 -->
  <div class="panel right">
    <h3>已选类目（全部大类汇总）</h3>
    <div class="ctrl-bar">
      <button class="btn-json" id="btnJson" onclick="exportJSON()">JSON</button>
      <button class="btn-txt"  id="btnTxt"  onclick="exportTXT()">TXT</button>
      <button class="btn-csv"  id="btnCsv"  onclick="exportCSV()">CSV</button>
      <button class="secondary" onclick="copyResult()">复制清单</button>
    </div>
    <div id="resultCount" class="count"></div>
    <div id="result"></div>
  </div>
</div>

<script>
/* ============================================================
   商标类目选择器（按大类分页）
   数据结构: [{ classNo, className, groups:[{g, groupTitle, items:[{code,name}]}] }]
   ============================================================ */
const data = new Map()          // 已加载的类：classNo -> 类对象
let selected   = new Map()     // 已选：key = classNo-g-code
let currentNo  = null          // 当前正在编辑的大类编号（懒加载）
let curOnly    = false         // 只看已选开关
const CLASS_COUNT = 45         // 已知大类总数（不预测，点哪个加载哪个）

const treeEl   = document.getElementById('tree')
const resEl    = document.getElementById('result')
const countEl  = document.getElementById('resultCount')
const treeCnt  = document.getElementById('treeCount')
const searchEl = document.getElementById('search')
const tabsEl   = document.getElementById('tabs')
const titleEl  = document.getElementById('panelTitle')
const statusEl = document.getElementById('loadStatus')
const mvCountEl = document.getElementById('mvCount')

const keyOf = (cno,g,code)=> `${cno}-${g}-${code}`

function applySelect(cls, gr, it, on){
  const k = keyOf(cls.classNo, gr.g, it.code)
  if(on) selected.set(k, {classNo:cls.classNo, className:cls.className, g:gr.g, groupTitle:gr.groupTitle, code:it.code, name:it.name})
  else   selected.delete(k)
  saveSelected()
}

/* ============================================================
   懒加载：点哪个大类才 fetch 哪个大类，已加载的缓存在内存
   ============================================================ */
async function openClass(no){
  if(data.has(no)){ setCurrent(no); renderTree(); renderTabs(); return }
  statusEl.textContent = `加载第${no}类…`
  let cls=null
  try{
    let r = await fetch(`data/${String(no).padStart(2,'0')}.json`)
    if(!r.ok) r = await fetch(`data/${no}.json`)
    if(r.ok){ cls = await r.json(); data.set(no, cls) }
  }catch(e){}
  if(!cls){ statusEl.textContent=`第${no}类加载失败`; return }
  statusEl.textContent='已缓存'
  setCurrent(no); renderTree(); renderTabs(); renderResult()
}
function setCurrent(no){ if(data.has(no)) currentNo = no }
function curClass(){ return data.get(currentNo) || null }

/* ============================================================
   本地缓存：仅缓存已选小项（轻量），不缓存大量类目数据
   ============================================================ */
const LS_SELECT = 'brand:select:v4'

function saveSelected(){
  try{ localStorage.setItem(LS_SELECT, JSON.stringify([...selected.values()])) }catch(e){}
}
function loadSelected(){
  try{
    const raw = localStorage.getItem(LS_SELECT)
    if(!raw) return
    const arr = JSON.parse(raw)
    if(!Array.isArray(arr)) return
    const sel = new Map()
    arr.forEach(it=>{ if(it && it.code!=null && it.classNo!=null) sel.set(`${it.classNo}-${it.g}-${it.code}`, it) })
    selected = sel
  }catch(e){}
}

/* ---------- Tabs 栏（懒加载：点击才加载） ---------- */
function renderTabs(){
  tabsEl.innerHTML = ''
  for(let no=1; no<=CLASS_COUNT; no++){
    // 该大类已选小类数（无需加载该大类即可统计）
    let n=0
    for(const v of selected.values()) if(v.classNo===no) n++
    const b = document.createElement('button')
    b.className = 'tab' + (no===currentNo?' active':'') + (n>0?' sel':'')
    b.onclick = ()=>{ openClass(no) }
    b.textContent = `第${no}类` + (n?`(${n})`:'')
    tabsEl.appendChild(b)
  }
}

/* ---------- 当前大类渲染 ---------- */
function renderTree(){
  const cls = curClass()
  if(!cls){ treeEl.innerHTML='<div style="color:#888">点上方某个大类开始</div>'; return }
  titleEl.textContent = cls.className
  const keyword = searchEl.value.trim().toLowerCase()
  let visible = 0
  treeEl.innerHTML = ''

  const clsDiv = document.createElement('div')
  clsDiv.className = 'tree-item'

  cls.groups.forEach(gr=>{
    // 过滤
    const titleMatch = !keyword || gr.groupTitle.includes(keyword)
    let grItems = gr.items.filter(it=>!keyword || it.name.toLowerCase().includes(keyword)||it.code.includes(keyword)||titleMatch)
    if(keyword && titleMatch && grItems.length===0) grItems = gr.items
    if(keyword && grItems.length===0 && !titleMatch) return
    // 只看已选
    if(curOnly) grItems = grItems.filter(it=>selected.has(keyOf(cls.classNo,gr.g,it.code)))
    if(grItems.length===0 && !curOnly) return

    // 类似群行（label 包裹，点击文字也能勾选）
    const gkeys = gr.items.map(it=>keyOf(cls.classNo,gr.g,it.code))
    const grLabel = document.createElement('label')
    const grCheck = document.createElement('input')
    grCheck.type='checkbox'
    grCheck.checked = gkeys.length>0 && gkeys.every(k=>selected.has(k))
    grCheck.indeterminate = !grCheck.checked && gkeys.some(k=>selected.has(k))
    if(curOnly) grCheck.disabled = true
    grCheck.onchange = e=>{
      gr.items.forEach(it=>applySelect(cls,gr,it,e.target.checked))
      renderTree(); renderResult(); renderTabs()
    }
    grLabel.appendChild(grCheck)
    grLabel.append(gr.groupTitle)
    const grBar = document.createElement('div')
    grBar.className = 'group-title'
    grBar.appendChild(grLabel)
    clsDiv.appendChild(grBar)

    grItems.forEach(it=>{
      const k = keyOf(cls.classNo,gr.g,it.code)
      const row = document.createElement('div')
      row.className = 'item' + (selected.has(k)?' sel':'')
      const lbl = document.createElement('label')
      const cb = document.createElement('input')
      cb.type='checkbox'
      cb.checked = selected.has(k)
      cb.onchange = e=>{
        applySelect(cls,gr,it,e.target.checked)
        renderTree(); renderResult(); renderTabs();
      }
      lbl.appendChild(cb)
      lbl.append(`【${gr.g}】${it.code} ${it.name}`)
      row.appendChild(lbl)
      clsDiv.appendChild(row)
      visible++
    })
  })
  treeEl.appendChild(clsDiv)
  treeCnt.textContent = curOnly? (`已选 ${visible} 项`) : (keyword? `匹配 ${visible} 项`:'')
}

/* ---------- 汇总 ---------- */
function renderResult(){
  const group = {}
  for(const item of selected.values()){
    if(!group[item.classNo]) group[item.classNo] = {title:item.className,list:[]}
    group[item.classNo].list.push(item)
  }
  const keys = Object.keys(group).sort((a,b)=>a-b)
  let html=''
  for(const k of keys){
    html += `<div style="margin:8px 0"><strong>${group[k].title}</strong>（${group[k].list.length}）<ul style="margin:4px 0 12px 16px">`
    group[k].list.sort((a,b)=> a.g.localeCompare(b.g)||a.code.localeCompare(b.code)).forEach(it=>{
      html += `<li><span>【${it.g} ${it.groupTitle}】${it.code} ${it.name}</span></li>`
    })
    html += `</ul></div>`
  }
  resEl.innerHTML = html || "<div style='color:#888'>勾选左侧小类，此处自动汇总</div>"
  countEl.textContent = `共 ${selected.size} 个小类`
  mvCountEl.textContent = selected.size
  refreshButtons()
  saveSelected()
}

function clearAll(){
  selected.clear(); curOnly=false; searchEl.value=''
  saveSelected()
  renderTree(); renderResult(); renderTabs()
}
/* 只清空当前正在操作的大类，不影响其他类 */
function clearClass(){
  const no = currentNo
  if(no==null){ return }
  for(const k of [...selected.keys()]){
    if(selected.get(k).classNo === no) selected.delete(k)
  }
  curOnly=false
  saveSelected()
  renderTree(); renderResult(); renderTabs()
}
function toggleCurOnly(){
  curOnly = !curOnly; renderTree()
  document.getElementById('curOnlyBtn').textContent = curOnly?'显示全部':'只看已选'
}

/* ---------- 导出 ---------- */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime})
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a'); a.href=url; a.download=filename
  document.body.appendChild(a); a.click()
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove()},100)
}

function exportJSON(){
  const out = buildStructured()
  download('商标已选类目.json', JSON.stringify(out,null,2), 'application/json')
}
function exportTXT(){
  const group={}
  for(const it of selected.values()){
    if(!group[it.classNo]) group[it.classNo]={title:it.className,list:[]}
    group[it.classNo].list.push(it)
  }
  let txt=`商标已选类目清单（共 ${selected.size} 个小类）\n${'='.repeat(50)}\n\n`
  for(const k of Object.keys(group).sort((a,b)=>a-b)){
    txt += group[k].title+`（${group[k].list.length}）\n`
    group[k].list.sort((a,b)=> a.g.localeCompare(b.g)||a.code.localeCompare(b.code)).forEach(it=>{
      txt += `  - 【${it.g} ${it.groupTitle}】${it.code} ${it.name}\n`
    })
    txt+='\n'
  }
  download('商标已选类目清单.txt', txt, 'text/plain;charset=utf-8')
}
function exportCSV(){
  const arr=[...selected.values()]
  arr.sort((a,b)=>(a.classNo-b.classNo)||a.g.localeCompare(b.g)||a.code.localeCompare(b.code))
  const rows=[['序号','商品类别','类似群','商品名称']]
  arr.forEach((it,i)=>rows.push([i+1, it.classNo, it.g, it.name]))
  const csv=rows.map(r=>r.map(c=>{ c=(c==null?'':String(c)); return /[\",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c }).join(',')).join('\n')
  download('商标已选类目.csv','\uFEFF'+csv,'text/csv;charset=utf-8')
}
function copyResult(){
  if(!selected.size){ alert('请先勾选'); return }
  let txt=''
  for(const it of selected.values()) txt += `【${it.g} ${it.groupTitle}】${it.code} ${it.name}\n`
  navigator.clipboard? navigator.clipboard.writeText(txt).then(()=>alert('已复制')) : (()=>{})()
}
function buildStructured(){
  const map={}
  for(const it of selected.values()){
    if(!map[it.classNo]) map[it.classNo]={classNo:it.classNo,className:it.className,groups:{}}
    if(!map[it.classNo].groups[it.g]) map[it.classNo].groups[it.g]={g:it.g,groupTitle:it.groupTitle,items:[]}
    map[it.classNo].groups[it.g].items.push({code:it.code,name:it.name})
  }
  const classes=Object.keys(map).sort((a,b)=>a-b).map(no=>{
    const c=map[no], groups=[]
    Object.keys(c.groups).sort().forEach(g=>{ const gi=c.groups[g]; gi.items.sort((x,y)=>x.code.localeCompare(y.code)); groups.push({g:gi.g,groupTitle:gi.groupTitle,items:gi.items}) })
    return {classNo:+no,className:c.className,groups}
  })
  return {exportedAt:new Date().toISOString(), totalItems:selected.size, classes}
}
function refreshButtons(){
  const on=selected.size>0
  ;['btnJson','btnTxt','btnCsv'].forEach(id=>{ document.getElementById(id).disabled=!on })
}

/* 移动端：切换 选择 / 已选 两个面板 */
function showPanel(which){
  const main = document.querySelector('.main')
  const on = which==='res'
  main.classList.toggle('show-result', on)
  document.getElementById('mvSel').classList.toggle('on', !on)
  document.getElementById('mvRes').classList.toggle('on', on)
}

/* ---------- 启动：秒开，不预取任何类目 ---------- */
function boot(){
  loadSelected()               // 恢复已选（轻量）
  statusEl.textContent = '就绪'
  renderTabs()
  renderResult()
  // 若已有已选，默认打开第一个被选的大类方便回看
  const first = [...selected.values()]
    .map(v=>v.classNo).sort((a,b)=>a-b)[0]
  if(first) openClass(first)
  else renderTree()
}

// ---- 启动 ----
window.clearAll=clearAll; window.clearClass=clearClass; window.toggleCurOnly=toggleCurOnly
window.exportJSON=exportJSON; window.exportTXT=exportTXT; window.exportCSV=exportCSV
window.copyResult=copyResult; window.showPanel=showPanel
searchEl.addEventListener('input', renderTree)
boot()
</script>
</body>
</html>
